        data_type: timestamp_ntz
        config:
          meta:
            classification: internal
            pii: false

  - name: silver_status_type
    description: "Look-up table containing normalized status definitions used across trades, customer accounts, and system operations."
    config:
      contract:
        enforced: true
    columns:
      - name: status_id
        data_type: varchar
        tests:
          - not_null: {config: {severity: error}}
          - unique: {config: {severity: error}}
          - accepted_values:
              arguments:
                values: ['ACTV', 'CMPT', 'CNCL', 'PNDG', 'SBMT', 'INAC']
              config: {severity: warn}
        config:
          meta:
            classification: public
            pii: false
      - name: status_name
        data_type: varchar
        config:
          meta:
            classification: public
            pii: false
      - name: _batch_id
        data_type: integer
        config:
          meta:
            classification: internal
            pii: false
      - name: _loaded_at
        data_type: timestamp_ntz
        config:
          meta:
            classification: internal
            pii: false

  - name: silver_tax_rate
    description: "Reference table defining applicable tax rate schedules, names, and percentage values."
    config:
      contract:
        enforced: true
    columns:
      - name: tax_rate_id
        data_type: varchar
        tests:
          - not_null: {config: {severity: error}}
          - unique: {config: {severity: error}}
        config:
          meta:
            classification: public
            pii: false
      - name: tax_rate_name
        data_type: varchar
        config:
          meta:
            classification: public
            pii: false
      - name: tax_rate
        data_type: numeric
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
              config: {severity: warn}
        config:
          meta:
            classification: public
            pii: false
      - name: _batch_id
        data_type: integer
        config:
          meta:
            classification: internal
            pii: false
      - name: _loaded_at
        data_type: timestamp_ntz
        config:
          meta:
            classification: internal
            pii: false

  - name: silver_time
