  - name: silver_account
    description: "Tracks customer brokerage account entities with Type 2 Slowly Changing Dimension (SCD Type 2) tracking and associations to managing brokers."
    config:
      contract:
        enforced: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [account_id, _batch_id, valid_from_date]
          config: {severity: error}
    columns:
      - name: account_version_sk
        data_type: varchar
        tests:
          - not_null: {config: {severity: error}}
          - unique: {config: {severity: error}}
        config:
          meta:
            classification: internal
            pii: false
      - name: account_id
        data_type: integer
        tests:
          - not_null: {config: {severity: error}}
        config:
          meta:
            classification: confidential
            pii: false
      - name: broker_id
        data_type: integer
        tests:
          - not_null: {config: {severity: error}}
          - relationships:
              arguments:
                to: ref('silver_hr')
                field: employee_id
              config: {severity: warn}
        config:
          meta:
            classification: internal
            pii: false
      - name: customer_id
        data_type: integer
        tests:
          - not_null: {config: {severity: error}}
          - relationships:
              arguments:
                to: ref('silver_customer')
                field: customer_id
              config: {severity: warn}
        config:
          meta:
            classification: confidential
            pii: false
      - name: account_name
        data_type: varchar
        config:
          meta:
            classification: confidential
            pii: false
      - name: tax_status
        data_type: integer
        config:
          meta:
            classification: confidential
            pii: false
      - name: status_id
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['ACTV', 'INAC']
              config: {severity: warn}
        config:
          meta:
            classification: internal
            pii: false
      - name: cdc_flag
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['I', 'U']
              config: {severity: warn}
        config:
          meta:
            classification: internal
            pii: false
      - name: valid_from_date
        data_type: date
        tests:
          - not_null: {config: {severity: error}}
        config:
          meta:
            classification: internal
            pii: false
      - name: valid_to_date
        data_type: date
        tests:
          - not_null: {config: {severity: error}}
        config:
          meta:
            classification: internal
            pii: false
      - name: is_current
        data_type: boolean
        tests:
          - not_null: {config: {severity: error}}
        config:
          meta:
            classification: internal
            pii: false
      - name: _batch_id
        data_type: integer
        config:
          meta:
            classification: internal
            pii: false
      - name: _source_table
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['bronze_account', 'bronze_mgmt_account']
              config: {severity: warn}
        config:
          meta:
            classification: internal
            pii: false

