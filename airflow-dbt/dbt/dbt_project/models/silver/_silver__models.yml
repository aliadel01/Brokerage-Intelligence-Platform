        data_type: varchar
        config:
          meta:
            classification: public
            pii: false
      - name: day_of_week_num
        data_type: integer
        config:
          meta:
            classification: public
            pii: false
      - name: day_of_week_desc
        data_type: varchar
        config:
          meta:
            classification: public
            pii: false
      - name: fiscal_year_id
        data_type: integer
        config:
          meta:
            classification: public
            pii: false
      - name: fiscal_year_desc
        data_type: varchar
        config:
          meta:
            classification: public
            pii: false
      - name: fiscal_qtr_id
