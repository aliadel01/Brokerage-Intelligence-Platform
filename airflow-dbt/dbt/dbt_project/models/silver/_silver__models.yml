  - name: silver_date
    description: "Conforms date dimension data containing calendar and fiscal hierarchy metrics (years, quarters, months, weeks) along with holiday flags for temporal analysis."
    config:
      contract:
        enforced: true
    columns:
      - name: date_sk
        data_type: integer
        tests:
          - not_null: {config: {severity: error}}
          - unique: {config: {severity: error}}
        config:
          meta:
            classification: public
            pii: false
      - name: date_value
        data_type: date
        tests:
          - not_null: {config: {severity: error}}
        config:
          meta:
            classification: public
            pii: false
      - name: date_desc
        data_type: varchar
        config:
          meta:
            classification: public
            pii: false
      - name: calendar_year_id
        data_type: integer
        config:
          meta:
            classification: public
            pii: false
      - name: calendar_year_desc
        data_type: varchar
        config:
          meta:
            classification: public
            pii: false
      - name: calendar_qtr_id
