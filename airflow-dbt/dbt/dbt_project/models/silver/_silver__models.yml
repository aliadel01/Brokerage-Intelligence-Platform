        data_type: varchar
        config:
          meta:
            classification: internal
            pii: false
      - name: branch
        data_type: varchar
        config:
          meta:
            classification: internal
            pii: false
      - name: office
        data_type: varchar
        config:
          meta:
            classification: internal
            pii: false
      - name: phone
        data_type: varchar
        config:
          meta:
            classification: restricted_pii
            pii: true
      - name: _batch_id
        data_type: integer
        config:
          meta:
            classification: internal
            pii: false
      - name: _loaded_at
        data_type: timestamp_ntz
        config:
          meta:
            classification: internal
            pii: false

  - name: silver_industry
    description: "Reference dataset mapping specific industry categorizations to broader sector identifiers."
    config:
      contract:
        enforced: true
    columns:
      - name: industry_id
        data_type: varchar
        tests:
          - not_null: {config: {severity: error}}
          - unique: {config: {severity: error}}
        config:
          meta:
            classification: public
            pii: false
      - name: industry_name
        data_type: varchar
        config:
          meta:
            classification: public
            pii: false
      - name: sector_id
        data_type: varchar
        config:
          meta:
            classification: public
            pii: false
