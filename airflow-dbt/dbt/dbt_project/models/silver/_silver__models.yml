      - name: _batch_id
        data_type: integer
        config:
          meta:
            classification: internal
            pii: false
      - name: _loaded_at
        data_type: timestamp_ntz
        config:
          meta:
            classification: internal
            pii: false

  - name: silver_hr
    description: "Stores internal employee organizational structures and human resource records, including manager hierarchies, assigned branches, and employee contact details."
    config:
      contract:
        enforced: true
    columns:
      - name: employee_id
        data_type: integer
        tests:
          - not_null: {config: {severity: error}}
          - unique: {config: {severity: error}}
        config:
          meta:
            classification: confidential
            pii: false
      - name: manager_id
        data_type: integer
        tests:
          - relationships:
              arguments:
                to: ref('silver_hr')
                field: employee_id
              config: {severity: warn}
        config:
          meta:
            classification: confidential
            pii: false
      - name: first_name
        data_type: varchar
        config:
          meta:
            classification: restricted_pii
            pii: true
      - name: last_name
        data_type: varchar
        config:
          meta:
            classification: restricted_pii
            pii: true
      - name: middle_initial
        data_type: varchar
        config:
          meta:
            classification: restricted_pii
            pii: true
