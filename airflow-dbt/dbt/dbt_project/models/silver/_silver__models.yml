        config:
          meta:
            classification: public
            pii: false
      - name: calendar_qtr_desc
        data_type: varchar
        config:
          meta:
            classification: public
            pii: false
      - name: calendar_month_id
        data_type: integer
        config:
          meta:
            classification: public
            pii: false
