  - name: dim_account
    description: "SCD Type 2 dimension storing customer brokerage account details, including account status, associated broker, and customer relationships."
    config:
      contract:
        enforced: true
    columns:
      - name: account_sk
        data_type: varchar
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
        config:
          meta:
            surrogate_key: "passthrough: silver_account.account_version_sk (SCD2 version key, not hashed)"
            classification: internal
            pii: false
      - name: account_id
        data_type: integer
        config:
          meta:
            classification: confidential
            pii: false
      - name: account_name
        data_type: varchar
        config:
          meta:
            classification: confidential
            pii: false
      - name: tax_status
        data_type: integer
        config:
          meta:
            classification: confidential
            pii: false
      - name: account_status
        data_type: varchar
        config:
          meta:
            classification: internal
            pii: false
      - name: broker_sk
        data_type: varchar
        config:
          meta:
            classification: internal
            pii: false
        tests:
          - relationships:
              arguments:
                to: ref('dim_broker')
                field: broker_sk
              config:
                severity: warn
      - name: customer_sk
        data_type: varchar
        config:
          meta:
            classification: internal
            pii: false
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_sk
              config:
                severity: warn
      - name: effective_start_date
        data_type: date
        config:
          meta:
            classification: internal
            pii: false
      - name: effective_end_date
        data_type: date
        config:
          meta:
            classification: internal
            pii: false
      - name: is_current
        data_type: boolean
        config:
          meta:
            classification: internal
            pii: false
      - name: cdc_flag
        data_type: varchar
        config:
          meta:
            classification: internal
            pii: false

