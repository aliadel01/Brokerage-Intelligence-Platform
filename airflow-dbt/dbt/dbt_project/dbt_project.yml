# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_project'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Configuring the "on-run-end" hook to run reconciliation checks after dbt finishes running models.
on-run-end:
  - >
    {% do log_silver_reconciliation(
        'silver_hr',
        "select _batch_id, count(*) as bronze_cnt from " ~ source('bronze', 'bronze_hr') ~ " group by 1",
        ref('silver_hr'),
        1
    ) %}
    {% do log_silver_reconciliation(
        'silver_prospect',
        "select _batch_id, count(*) as bronze_cnt from " ~ source('bronze', 'bronze_prospect') ~ " group by 1",
        ref('silver_prospect'),
        10
    ) %}
    {% do log_silver_reconciliation(
        'silver_account',
        "select _batch_id, count(*) as bronze_cnt from (
           select _batch_id from " ~ source('bronze', 'bronze_account') ~ "
           union all
           select _batch_id from " ~ source('bronze', 'bronze_mgmt_account') ~ "
         ) u group by 1",
        ref('silver_account'),
        50
    ) %}
    {% do log_silver_reconciliation(
        'silver_customer',
        "select _batch_id, count(*) as bronze_cnt from (
           select _batch_id from " ~ source('bronze', 'bronze_customer') ~ "
           union all
           select _batch_id from " ~ source('bronze', 'bronze_mgmt_customer') ~ "
         ) u group by 1",
        ref('silver_customer'),
        50
    ) %}
    {% do log_silver_reconciliation(
        'silver_trade',
        "select _batch_id, count(*) as bronze_cnt from " ~ source('bronze', 'bronze_trade') ~ " group by 1",
        ref('silver_trade'),
        80
    ) %}
    {% do log_silver_reconciliation(
        'silver_trade_history',
        "select _batch_id, count(*) as bronze_cnt from (
           select _batch_id from " ~ source('bronze', 'bronze_trade_history') ~ "
           union all
           select _batch_id from " ~ source('bronze', 'bronze_trade') ~ " where _batch_id != 1
         ) u group by 1",
        ref('silver_trade_history'),
        30
    ) %}
    {% do log_silver_reconciliation(
        'silver_holding_history',
        "select _batch_id, count(*) as bronze_cnt from " ~ source('bronze', 'bronze_holding_history') ~ " group by 1",
        ref('silver_holding_history'),
        2
    ) %}
    {% do log_silver_reconciliation(
        'silver_watch_history',
        "select _batch_id, count(*) as bronze_cnt from " ~ source('bronze', 'bronze_watch_history') ~ " group by 1",
        ref('silver_watch_history'),
        2
    ) %}
    {% do log_silver_reconciliation(
        'silver_daily_market',
        "select _batch_id, count(*) as bronze_cnt from " ~ source('bronze', 'bronze_daily_market') ~ " group by 1",
        ref('silver_daily_market'),
        2
    ) %}
    {% do log_silver_reconciliation(
        'silver_cash_transaction',
        "select _batch_id, count(*) as bronze_cnt from " ~ source('bronze', 'bronze_cash_transaction') ~ " group by 1",
        ref('silver_cash_transaction'),
        2
    ) %}

  - >
    {% do log_gold_reconciliation(
        'dim_date',
        "select count(*) from " ~ ref('silver_date'),
        ref('dim_date'),
        2,
        true
    ) %}
    {% do log_gold_reconciliation(
        'dim_time',
        "select count(*) from " ~ ref('silver_time'),
        ref('dim_time'),
        2,
        true
    ) %}
    {% do log_gold_reconciliation(
        'dim_statustype',
        "select count(*) from " ~ ref('silver_status_type'),
        ref('dim_statustype'),
        2,
        true
    ) %}
    {% do log_gold_reconciliation(
        'dim_tradetype',
        "select count(*) from " ~ ref('silver_trade_type'),
        ref('dim_tradetype'),
        2,
        true
    ) %}
    {% do log_gold_reconciliation(
        'dim_broker',
        "select count(*) from " ~ ref('silver_hr'),
        ref('dim_broker'),
        2,
        true
    ) %}
    {% do log_gold_reconciliation(
        'dim_customer',
        "select count(*) from " ~ ref('silver_customer'),
        ref('dim_customer'),
        2,
        true
    ) %}
    {% do log_gold_reconciliation(
        'dim_account',
        "select count(*) from " ~ ref('silver_account'),
        ref('dim_account'),
        2,
        true
    ) %}
    {% do log_gold_reconciliation(
        'dim_prospect',
        "select count(*) from " ~ ref('silver_prospect'),
        ref('dim_prospect'),
        2,
        true
    ) %}
    {% do log_gold_reconciliation(
        'dim_company',
        "select count(*) from " ~ ref('silver_finwire_company'),
        ref('dim_company'),
        60,
        true
    ) %}
    {% do log_gold_reconciliation(
        'dim_security',
        "select count(*) from " ~ ref('silver_finwire_security'),
        ref('dim_security'),
        60,
        true
    ) %}
    {% do log_gold_reconciliation(
        'fact_trade',
        "select count(*) from " ~ ref('silver_trade'),
        ref('fact_trade'),
        2,
        false
    ) %}
    {% do log_gold_reconciliation(
        'fact_cashtransaction',
        "select count(*) from " ~ ref('silver_cash_transaction'),
        ref('fact_cashtransaction'),
        2,
        false
    ) %}
    {% do log_gold_reconciliation(
        'fact_watchitem',
        "select count(*) from " ~ ref('silver_watch_history'),
        ref('fact_watchitem'),
        2,
        false
    ) %}
    {% do log_gold_reconciliation(
        'fact_market_history',
        "select count(*) from " ~ ref('silver_daily_market'),
        ref('fact_market_history'),
        2,
        false
    ) %}
    {% do log_gold_reconciliation(
        'fact_company_financials',
        "select count(*) from " ~ ref('silver_finwire_financials'),
        ref('fact_company_financials'),
        2,
        false
    ) %}
    {% do log_gold_reconciliation(
        'fact_holding',
        "select count(*) from " ~ ref('silver_holding_history'),
        ref('fact_holding'),
        15,
        false
    ) %}
    {% do log_gold_reconciliation(
        'fact_trade_history',
        "select count(*) from " ~ ref('silver_trade_history'),
        ref('fact_trade_history'),
        15,
        false
    ) %}

  - "{% do log_test_results(results) %}"


# setting a default variable for the reconciliation threshold percentage.
vars:
  reconciliation_threshold_pct: 5

clean-targets:
  - "target"
  - "dbt_packages"


# Test Observability & Native Failures Persistence
# Section 6.4.2 & ADR 6.4.5 Compliance: Enforcing store_failures at root level
tests:
  +store_failures: true
  +schema: dbt_test_failures

  
# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
#
# No `staging:` node here on purpose -- confirmed with the user this
# project has no staging/bronze dbt models; bronze is populated by an
# ingestion pipeline outside dbt and only ever read via source().
#
# NOTE: this key ("dbt_project") must match `name:` above exactly, or
# dbt silently ignores this entire block and every model falls back to
# default config (view materialization, default schema) with no error.
models:
  dbt_project:
    silver:
      +schema: silver
      +materialized: table
      archetype_a:
        +tags: ['silver', 'static_dim']
      archetype_b_real_cdc:
        +tags: ['silver', 'cdc', 'real_cdc']
      archetype_b_quasi_cdc:
        +tags: ['silver', 'cdc', 'quasi_cdc']
      archetype_c:
        +tags: ['silver', 'snapshot_dim']
      archetype_d:
        +tags: ['silver', 'parsed']
      archetype_e:
        +tags: ['silver', 'batch1_only_fact']
      +meta:
        owner: brokerage-data-platform
        data_steward: role_steward
        technical_owner: role_custodian
    gold:
      +schema: gold
      +materialized: view
      fact_tables:
        +tags: ['gold', 'fact']
      dim_tables:
        +tags: ['gold', 'dim']
      +meta:
        owner: brokerage-data-platform
        data_steward: role_steward
        technical_owner: role_custodian