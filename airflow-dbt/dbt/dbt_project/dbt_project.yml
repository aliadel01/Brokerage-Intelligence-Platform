# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_project'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Configuring the "on-run-end" hook to run reconciliation checks after dbt finishes running models.
on-run-end:
  - >
    -- depends_on: {{ ref('silver_hr') }}
    -- depends_on: {{ ref('silver_prospect') }}
    -- depends_on: {{ ref('silver_account') }}
    -- depends_on: {{ ref('silver_customer') }}
    -- depends_on: {{ ref('silver_trade') }}
    -- depends_on: {{ ref('silver_trade_history') }}
    -- depends_on: {{ ref('silver_holding_history') }}
    -- depends_on: {{ ref('silver_watch_history') }}
    -- depends_on: {{ ref('silver_daily_market') }}
    -- depends_on: {{ ref('silver_cash_transaction') }}
    {{ run_silver_reconciliation_checks() }}

  - >
    -- depends_on: {{ ref('silver_date') }}
    -- depends_on: {{ ref('silver_time') }}
    -- depends_on: {{ ref('silver_status_type') }}
    -- depends_on: {{ ref('silver_trade_type') }}
    -- depends_on: {{ ref('silver_hr') }}
    -- depends_on: {{ ref('silver_customer') }}
    -- depends_on: {{ ref('silver_account') }}
    -- depends_on: {{ ref('silver_prospect') }}
    -- depends_on: {{ ref('silver_finwire_company') }}
    -- depends_on: {{ ref('silver_finwire_security') }}
    -- depends_on: {{ ref('silver_trade') }}
    -- depends_on: {{ ref('silver_cash_transaction') }}
    -- depends_on: {{ ref('silver_watch_history') }}
    -- depends_on: {{ ref('silver_daily_market') }}
    -- depends_on: {{ ref('silver_finwire_financials') }}
    -- depends_on: {{ ref('silver_holding_history') }}
    -- depends_on: {{ ref('silver_trade_history') }}
    -- depends_on: {{ ref('dim_date') }}
    -- depends_on: {{ ref('dim_time') }}
    -- depends_on: {{ ref('dim_statustype') }}
    -- depends_on: {{ ref('dim_tradetype') }}
    -- depends_on: {{ ref('dim_broker') }}
    -- depends_on: {{ ref('dim_customer') }}
    -- depends_on: {{ ref('dim_account') }}
    -- depends_on: {{ ref('dim_prospect') }}
    -- depends_on: {{ ref('dim_company') }}
    -- depends_on: {{ ref('dim_security') }}
    -- depends_on: {{ ref('fact_trade') }}
    -- depends_on: {{ ref('fact_cashtransaction') }}
    -- depends_on: {{ ref('fact_watchitem') }}
    -- depends_on: {{ ref('fact_market_history') }}
    -- depends_on: {{ ref('fact_company_financials') }}
    -- depends_on: {{ ref('fact_holding') }}
    -- depends_on: {{ ref('fact_trade_history') }}
    {{ run_gold_reconciliation_checks() }}

  - "{{ log_test_results(results) }}"

# setting a default variable for the reconciliation threshold percentage.
vars:
  reconciliation_threshold_pct: 5

clean-targets:
  - "target"
  - "dbt_packages"


# Test Observability & Native Failures Persistence
# Section 6.4.2 & ADR 6.4.5 Compliance: Enforcing store_failures at root level
tests:
  +store_failures: true
  +schema: dbt_test_failures

  
# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
#
# No `staging:` node here on purpose -- confirmed with the user this
# project has no staging/bronze dbt models; bronze is populated by an
# ingestion pipeline outside dbt and only ever read via source().
#
# NOTE: this key ("dbt_project") must match `name:` above exactly, or
# dbt silently ignores this entire block and every model falls back to
# default config (view materialization, default schema) with no error.
models:
  dbt_project:
    silver:
      +schema: silver
      +materialized: table
      archetype_a:
        +tags: ['silver', 'static_dim']
      archetype_b_real_cdc:
        +tags: ['silver', 'cdc', 'real_cdc']
      archetype_b_quasi_cdc:
        +tags: ['silver', 'cdc', 'quasi_cdc']
      archetype_c:
        +tags: ['silver', 'snapshot_dim']
      archetype_d:
        +tags: ['silver', 'parsed']
      archetype_e:
        +tags: ['silver', 'batch1_only_fact']
      +meta:
        owner: brokerage-data-platform
        data_steward: role_steward
        technical_owner: role_custodian
    gold:
      +schema: gold
      +materialized: view
      fact_tables:
        +tags: ['gold', 'fact']
      dim_tables:
        +tags: ['gold', 'dim']
      +meta:
        owner: brokerage-data-platform
        data_steward: role_steward
        technical_owner: role_custodian